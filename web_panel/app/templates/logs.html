{% extends "base.html" %}
{% block title %}Logs - MC Panel{% endblock %}
{% block content %}
<h1>Server Logs</h1>

<div class="tabs">
    <a href="/logs?source=mc&lines={{ lines }}" class="tab {% if source == 'mc' %}active{% endif %}">Minecraft</a>
    <a href="/logs?source=terraform&lines={{ lines }}" class="tab {% if source == 'terraform' %}active{% endif %}">Terraform</a>
</div>

{% if source == 'mc' %}
<div class="actions" style="margin-bottom: 1rem;">
    <form method="get" action="/logs?source=mc" style="display:inline; margin-right: 0.5rem;">
        <input type="hidden" name="source" value="mc">
        <select name="lines" class="select">
            <option value="50" {% if lines == 50 %}selected{% endif %}>50 Lines</option>
            <option value="100" {% if lines == 100 %}selected{% endif %}>100 Lines</option>
            <option value="200" {% if lines == 200 %}selected{% endif %}>200 Lines</option>
            <option value="500" {% if lines == 500 %}selected{% endif %}>500 Lines</option>
        </select>
        <button type="submit" class="btn btn-blue">Refresh</button>
    </form>
</div>

<div class="log-box">
    <pre>{{ logs }}</pre>
</div>
{% else %}
<div class="actions" style="margin-bottom: 1rem;">
    <form method="get" action="/logs?source=terraform" style="display:inline; margin-right: 0.5rem;">
        <input type="hidden" name="source" value="terraform">
        <select name="lines" class="select">
            <option value="50" {% if lines == 50 %}selected{% endif %}>50 Lines</option>
            <option value="100" {% if lines == 100 %}selected{% endif %}>100 Lines</option>
            <option value="200" {% if lines == 200 %}selected{% endif %}>200 Lines</option>
            <option value="500" {% if lines == 500 %}selected{% endif %}>500 Lines</option>
        </select>
        <button type="submit" class="btn btn-blue">Refresh</button>
    </form>
</div>

<div class="log-box">
    <pre>{{ logs }}</pre>
</div>
{% endif %}
{% endblock %}
