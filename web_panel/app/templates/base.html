<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MC Panel{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="logo">
                <h2>MC Panel</h2>
            </div>
            <ul>
                <li><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a></li>
                <li><a href="/logs" class="{% if request.url.path == '/logs' %}active{% endif %}">Logs</a></li>
                <li><a href="/mods" class="{% if request.url.path == '/mods' %}active{% endif %}">Mods</a></li>
                <li><a href="/players" class="{% if request.url.path == '/players' %}active{% endif %}">Players</a></li>
                <li><a href="/oracle" class="{% if request.url.path == '/oracle' %}active{% endif %}">Oracle Cloud</a></li>
                <li><a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Settings</a></li>
            </ul>
        </nav>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
