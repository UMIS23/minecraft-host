{% extends "base.html" %}
{% block title %}Settings - MC Panel{% endblock %}
{% block content %}
<h1>Server Settings</h1>

{% if not configured %}
<div class="alert alert-info">
    First-time setup: Enter your server IP address and SSH credentials.
</div>
{% endif %}

<div class="card full-width">
    <form method="post" action="/settings">
        <div class="form-grid">
            <div class="form-group">
                <label>Server IP</label>
                <input type="text" name="server_ip" value="{{ config.get('server_ip', '') }}" class="input" placeholder="e.g. 1.2.3.4" required>
            </div>
            <div class="form-group">
                <label>SSH User</label>
                <input type="text" name="ssh_user" value="{{ config.get('ssh_user', 'ubuntu') }}" class="input">
            </div>
            <div class="form-group">
                <label>Minecraft Version</label>
                <input type="text" name="minecraft_version" value="{{ config.get('minecraft_version', '1.20.1') }}" class="input">
            </div>
            <div class="form-group">
                <label>Server Type</label>
                <select name="server_type" class="select">
                    {% for t in ["vanilla", "forge", "fabric", "paper", "spigot", "bukkit", "purpur", "quilt", "neoforge"] %}
                    <option value="{{ t }}" {% if config.get('server_type', 'vanilla') == t %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>RAM (GB)</label>
                <input type="number" name="ram_gb" value="{{ config.get('ram_gb', 4) }}" class="input" min="1" max="32">
            </div>
            <div class="form-group">
                <label>Max Players</label>
                <input type="number" name="max_players" value="{{ config.get('max_players', 20) }}" class="input" min="1">
            </div>
            <div class="form-group">
                <label>View Distance</label>
                <input type="number" name="view_distance" value="{{ config.get('view_distance', 10) }}" class="input" min="1" max="32">
            </div>
            <div class="form-group">
                <label>MOTD / Server Name</label>
                <input type="text" name="server_name" value="{{ config.get('server_name', 'MC Server') }}" class="input">
            </div>
            <div class="form-group">
                <label>Server Port (Fixed)</label>
                <input type="number" name="server_port" value="{{ config.get('server_port', 25565) }}" class="input" disabled>
                <small style="color: #666; font-size: 0.75rem;">Managed by NLB. Cannot be changed.</small>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="online_mode" {% if config.get('online_mode') %}checked{% endif %}>
                    Online Mode
                </label>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="enable_rcon" {% if config.get('enable_rcon', true) %}checked{% endif %}>
                    Enable RCON
                </label>
            </div>
        </div>
        <button type="submit" class="btn btn-green" style="margin-top: 1.25rem;">Save Settings</button>
    </form>
</div>
{% endblock %}
