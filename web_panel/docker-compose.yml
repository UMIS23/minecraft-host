services:
  panel:
    build: .
    container_name: mc-panel
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json
      - ./${SSH_KEY_FILE:-key1}:/app/key1:ro
      - ./${OCI_KEY_FILE:-key1.pem}:/app/key1.pem:ro
      - ..:/tf
    expose:
      - "8000"
    networks:
      - mc-net

  nginx:
    image: nginx:alpine
    container_name: mc-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - panel
    networks:
      - mc-net

networks:
  mc-net:
    driver: bridge
